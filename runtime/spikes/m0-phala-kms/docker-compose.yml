# Phala Cloud CVM compose for the M0-1 KMS drill.
# Deploy A: KEY_VARIANT=v1 → note derived_address.
# Kill it. Redeploy the EXACT same compose → derived_address MUST match.
# Deploy B: change KEY_VARIANT to v2 (different compose hash) → derived_address MUST differ.
services:
  drill:
    image: <pushed-image-ref>   # push app/ image to a registry, pin by digest
    ports:
      - "8080:8080"
    environment:
      - KEY_VARIANT=v1
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
